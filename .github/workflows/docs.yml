name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install deps
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Build & deploy
        run: |
          julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}